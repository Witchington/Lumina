<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <!-- Lumina: an "L" as a lamp post with its light on top. Lumen = light. -->
  <defs>
    <radialGradient id="tile" cx="34%" cy="22%" r="95%">
      <stop offset="0" stop-color="#4a2a17"/>
      <stop offset=".45" stop-color="#22150f"/>
      <stop offset="1" stop-color="#0e0907"/>
    </radialGradient>
    <radialGradient id="pool" cx="38%" cy="27%" r="55%">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#ff7a1f" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ff7a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd59a"/>
      <stop offset=".55" stop-color="#ffa64a"/>
      <stop offset="1" stop-color="#f07a22"/>
    </linearGradient>
    <radialGradient id="bulb" cx="50%" cy="45%" r="50%">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset=".45" stop-color="#ffe0a6"/>
      <stop offset="1" stop-color="#ffab52"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="clip"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#tile)"/>
    <rect width="512" height="512" fill="url(#pool)"/>
    <!-- glow behind the letter -->
    <path d="M196 214 V356 H344" fill="none" stroke="#ff8a2a" stroke-width="72" stroke-linecap="round" stroke-linejoin="round" opacity=".55" filter="url(#glow)"/>
    <circle cx="196" cy="128" r="58" fill="#ffb25c" opacity=".75" filter="url(#glow)"/>
    <!-- the L -->
    <path d="M196 214 V356 H344" fill="none" stroke="url(#stroke)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M182 222 V346" fill="none" stroke="#fff3dc" stroke-width="10" stroke-linecap="round" opacity=".45" filter="url(#soft)"/>
    <!-- the light -->
    <circle cx="196" cy="128" r="34" fill="url(#bulb)"/>
    <!-- warm light pooling on the "floor" -->
    <ellipse cx="270" cy="420" rx="150" ry="26" fill="#ff8a2a" opacity=".16" filter="url(#glow)"/>
  </g>
  <rect x="1.5" y="1.5" width="509" height="509" rx="110" fill="none" stroke="#ffb46a" stroke-opacity=".18" stroke-width="3"/>
</svg>
